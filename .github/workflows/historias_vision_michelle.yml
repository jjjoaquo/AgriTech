name: AgriTech | Michelle | Historias de visión

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/historias_vision_michelle.yml'
      - 'mvp/app.py'
      - 'mvp/senasa.py'
      - 'mvp/tests/test_upload.py'
      - 'mvp/tests/test_yolo_detection.py'
      - 'mvp/tests/test_no_detection.py'
      - 'mvp/tests/test_class_mapping.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/historias_vision_michelle.yml'
      - 'mvp/app.py'
      - 'mvp/senasa.py'
      - 'mvp/tests/test_upload.py'
      - 'mvp/tests/test_yolo_detection.py'
      - 'mvp/tests/test_no_detection.py'
      - 'mvp/tests/test_class_mapping.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  carga:
    name: SCRUM-10 | Carga y validación de imagen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Flask>=3,<4' 'Pillow>=10' 'pypdf>=4' 'PyYAML>=6'
      - run: python -m unittest discover -s tests -p 'test_upload.py' -v

  deteccion:
    name: SCRUM-11 | Recuadros, clase y confianza
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Flask>=3,<4' 'Pillow>=10' 'pypdf>=4' 'PyYAML>=6'
      - run: python -m unittest discover -s tests -p 'test_yolo_detection.py' -v

  sin_plaga:
    name: SCRUM-12 | Respuesta sin hallazgos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Flask>=3,<4' 'Pillow>=10' 'pypdf>=4' 'PyYAML>=6'
      - run: python -m unittest discover -s tests -p 'test_no_detection.py' -v

  sigia:
    name: SCRUM-13 | Correspondencia de clases con SIGIA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Flask>=3,<4' 'Pillow>=10' 'pypdf>=4' 'PyYAML>=6'
      - run: python -m unittest discover -s tests -p 'test_class_mapping.py' -v

  aprobacion:
    name: Puerta | Cuatro historias de visión
    needs: [carga, deteccion, sin_plaga, sigia]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Exigir cuatro resultados aprobados
        env:
          CARGA: ${{ needs.carga.result }}
          DETECCION: ${{ needs.deteccion.result }}
          SIN_PLAGA: ${{ needs.sin_plaga.result }}
          SIGIA: ${{ needs.sigia.result }}
        run: |
          {
            echo '## Historias de visión de Michelle'
            echo '| Historia | Resultado |'
            echo '|---|---|'
            echo "| SCRUM-10 | $CARGA |"
            echo "| SCRUM-11 | $DETECCION |"
            echo "| SCRUM-12 | $SIN_PLAGA |"
            echo "| SCRUM-13 | $SIGIA |"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$CARGA" = success
          test "$DETECCION" = success
          test "$SIN_PLAGA" = success
          test "$SIGIA" = success
