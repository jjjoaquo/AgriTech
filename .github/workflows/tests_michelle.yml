name: Pruebas AgriTech - Michelle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-michelle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trazabilidad:
    name: Evidencia de commit y Jira
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar código e historial inmediato
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Registrar SHA, autor, fecha e historia
        run: python mvp/ci/traceability_report.py
      - name: Conservar evidencia de trazabilidad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trazabilidad-michelle
          path: mvp/test-results/trazabilidad-github.*
          if-no-files-found: warn

  pruebas:
    name: Pruebas funcionales y UX visual
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mvp
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias de pruebas
        run: python -m pip install 'Flask>=3.0,<4' 'Pillow>=10' 'pypdf>=4'
      - name: Validar sintaxis de JavaScript de la interfaz
        run: |
          node --check static/app.js
          node --check static/general.js
          node --check static/cultivo_3d.js
          node --check static/visual-2026.js
      - name: Pruebas unitarias de todas las historias implementadas
        run: |
          mkdir -p test-results
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-results/unitarias.txt
      - name: Recorrido público y recursos visuales SCRUM-91
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_visual_experience.py' -v 2>&1 | tee test-results/ux-visual.txt
      - name: Integración funcional de rutas y permisos
        run: |
          mkdir -p test-results
          set -o pipefail
          python smoke_test.py 2>&1 | tee test-results/funcionales.txt
      - name: Conservar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas-michelle
          path: mvp/test-results/
          if-no-files-found: warn
