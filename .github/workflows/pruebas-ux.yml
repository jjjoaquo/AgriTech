name: AgriTech - Pruebas UX/UI
on:
  push:
    branches: [favio/scrum-jira-ux]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar-ux:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Jinja2
        run: python -m pip install 'Jinja2>=3,<4'
      - name: Ejecutar 9 pruebas estructurales
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s mvp/tests -p 'test_ux_jira.py' -v 2>&1 | tee resultado_pruebas_ux.txt
      - name: Adjuntar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-pruebas-ux
          path: resultado_pruebas_ux.txt
          if-no-files-found: warn
