name: "AgriTech | Favio | CI y Seguridad"

# Pipeline compartido: cualquier colaborador puede validarlo en su rama.
# Se puede invocar desde otros workflows para evitar duplicar las pruebas.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: favio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: "1. Calidad y sintaxis"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar linter
        run: python -m pip install flake8
      - name: Compilación de módulos y errores críticos de Python
        run: |
          python -m compileall -q mvp
          flake8 mvp --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Sintaxis de JavaScript
        run: |
          node --check mvp/static/app.js
          node --check mvp/static/general.js
          node --check mvp/static/cultivo_3d.js

  historias-ux:
    name: "2. Pruebas HU y UX"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install "Jinja2>=3,<4"
      - name: Ejecutar pruebas estructurales de historias de usuario
        shell: bash
        run: |
          set -o pipefail
          mkdir -p mvp/test-results
          python -m unittest discover -s mvp/tests -p 'test_ux_jira.py' -v 2>&1 | tee mvp/test-results/historias-ux.txt
      - name: Conservar evidencia UX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: favio-evidencia-ux
          path: mvp/test-results/historias-ux.txt
          if-no-files-found: warn

  seguridad:
    name: "3. Pruebas de seguridad"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias para pruebas Flask sin pesos YOLO
        run: python -m pip install "Flask>=3,<4" "Pillow>=10" "pypdf>=4" "PyYAML>=6"
      - name: Verificar que las pruebas unitarias no importen Playwright
        run: python -m unittest discover -s mvp/tests -p 'test_favio_e2e.py' -v
      - name: Validar sesiones, autenticación, roles y CSRF
        shell: bash
        run: |
          set -o pipefail
          mkdir -p mvp/test-results
          python -m unittest discover -s mvp/tests -p 'test_favio_security.py' -v 2>&1 | tee mvp/test-results/seguridad.txt
      - name: Comprobar fuerza bruta, cookies y límites de petición
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s mvp/tests -p 'test_seguridad_avanzada.py' -v 2>&1 | tee mvp/test-results/seguridad-avanzada.txt
      - name: Prevenir regresiones de permisos entre agricultores (IDOR/BOLA)
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s mvp/tests -p 'test_regresion_permisos.py' -v 2>&1 | tee mvp/test-results/regresion-permisos.txt
      - name: Conservar evidencia de seguridad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: favio-evidencia-seguridad
          path: |
            mvp/test-results/seguridad.txt
            mvp/test-results/seguridad-avanzada.txt
            mvp/test-results/regresion-permisos.txt
          if-no-files-found: warn

  integracion:
    name: "4. Integración Flask (smoke test)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias para pruebas
        run: python -m pip install "Flask>=3,<4" "Pillow>=10" "pypdf>=4" "PyYAML>=6"
      - name: Probar rutas, detección simulada y registro
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          python smoke_test.py 2>&1 | tee test-results/integracion.txt
      - name: Conservar evidencia de integración
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: favio-evidencia-integracion
          path: mvp/test-results/integracion.txt
          if-no-files-found: warn

  navegador-e2e:
    name: "5. Navegador real (Playwright)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Flask y Playwright
        run: |
          python -m pip install "Flask>=3,<4" "Pillow>=10" "pypdf>=4" "PyYAML>=6" "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium
      - name: Iniciar aplicación local y ejecutar recorrido en Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mvp/test-results/playwright
          cd mvp
          python app.py > test-results/playwright/servidor.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5000/ >/dev/null
          AGRI_RUN_PLAYWRIGHT=1 python -m unittest discover -s tests -p 'test_favio_e2e.py' -v 2>&1 | tee test-results/playwright/e2e.txt
      - name: Guardar capturas y evidencias E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: favio-evidencia-playwright
          path: mvp/test-results/playwright/
          if-no-files-found: warn

  sast:
    name: "6. Análisis estático de seguridad (Bandit)"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar analizador de seguridad
        run: python -m pip install "bandit>=1.8,<2"
      - name: Analizar vulnerabilidades de alta severidad y confianza
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mvp/test-results
          bandit -r mvp -x mvp/tests -lll -iii -f json -o mvp/test-results/bandit.json
      - name: Publicar reporte de análisis estático
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: favio-evidencia-sast
          path: mvp/test-results/bandit.json
          if-no-files-found: warn

  dependencias:
    name: "7. Auditoría de dependencias de Flask"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crear entorno aislado e instalar dependencias del servidor para pruebas
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/agritech-audit"
          source "$RUNNER_TEMP/agritech-audit/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install "Flask>=3,<4" "Pillow>=10" "pypdf>=4" "PyYAML>=6" "pip-audit>=2.7,<3"
      - name: Detectar CVE en dependencias instaladas de la API de pruebas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mvp/test-results
          source "$RUNNER_TEMP/agritech-audit/bin/activate"
          pip-audit --local --format json --output mvp/test-results/dependencias-audit.json
      - name: Conservar auditoría de dependencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: favio-evidencia-dependencias
          path: mvp/test-results/dependencias-audit.json
          if-no-files-found: warn

  aprobacion:
    name: "8. Puerta de calidad"
    runs-on: ubuntu-latest
    needs: [calidad, historias-ux, seguridad, integracion, navegador-e2e, sast, dependencias]
    if: ${{ always() }}
    steps:
      - name: Bloquear aprobación ante cualquier fallo
        env:
          CALIDAD: ${{ needs.calidad.result }}
          UX: ${{ needs.historias-ux.result }}
          SEGURIDAD: ${{ needs.seguridad.result }}
          INTEGRACION: ${{ needs.integracion.result }}
          E2E: ${{ needs.navegador-e2e.result }}
          SAST: ${{ needs.sast.result }}
          DEPENDENCIAS: ${{ needs.dependencias.result }}
        run: |
          printf 'Calidad: %s\nUX: %s\nSeguridad: %s\nIntegración: %s\n' "$CALIDAD" "$UX" "$SEGURIDAD" "$INTEGRACION"
          test "$CALIDAD" = success
          test "$UX" = success
          test "$SEGURIDAD" = success
          test "$INTEGRACION" = success
          test "$E2E" = success
          test "$SAST" = success
          test "$DEPENDENCIAS" = success
