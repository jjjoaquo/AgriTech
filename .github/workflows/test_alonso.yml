name: Pipeline CI/CD - Alonso Ortiz Rodríguez

on:
  push:
    branches: [ "main", "Alonso" ]
  pull_request:
    branches: [ "main", "Alonso" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline-calidad-y-pruebas:
    name: Integración, Pruebas y Empaquetado
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mvp

    steps:
      - name: 1. Descarga del código fuente (Checkout)
        uses: actions/checkout@v4

      - name: 2. Configurar entorno Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Configurar entorno Node.js para validación de frontend 3D
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 4. Instalar dependencias del proyecto y herramientas de prueba
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'Flask>=3.0,<4' 'Pillow>=10' 'pypdf>=4' 'safetensors>=0.4' 'PyYAML>=6'
          python -m pip install flake8 pytest
          mkdir -p test-results

      - name: 5. Análisis estático de código y sintaxis (Linting)
        run: |
          echo "=== 5.1 Verificando sintaxis Python con flake8 ==="
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics 2>&1 | tee test-results/linter-python.txt
          
          echo "=== 5.2 Verificando sintaxis JavaScript (SCRUM-88: cultivo_3d.js) ==="
          node --check static/cultivo_3d.js
          node --check static/app.js
          node --check static/general.js

      - name: 6. Pruebas unitarias de Historias de Usuario (SCRUM-88, 86, 82, 81, 28, 25)
        run: |
          set -o pipefail
          echo "=== Ejecutando suite unitaria específica para las HUs de Alonso ==="
          python -m unittest discover -s tests -p 'test_alonso_hu.py' -v 2>&1 | tee test-results/pruebas-unitarias-alonso.txt

      - name: 7. Suite general de pruebas unitarias
        run: |
          set -o pipefail
          echo "=== Ejecutando todas las pruebas unitarias ==="
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee test-results/pruebas-unitarias-todas.txt

      - name: 8. Pruebas de integración y flujo funcional (Smoke Test)
        run: |
          set -o pipefail
          echo "=== Validando flujo completo end-to-end (SCRUM-86 parcelas, SCRUM-88 3D, exportación SCRUM-81) ==="
          python smoke_test.py 2>&1 | tee test-results/pruebas-integracion.txt

      - name: 9. Empaquetado de la aplicación para producción (Packaging)
        run: |
          echo "=== Preparando empaquetado de producción ==="
          mkdir -p models
          touch models/classes_ip102.txt
          touch models/esparragos_yolov8n_v2.pt
          touch models/esparragos_yolo26n_semisupervisado.pt
          python deploy/build_bundle.py
          ls -lh ../esparragos-mvp-produccion.tar.gz

      - name: 10. Conservar evidencias y artefacto empaquetado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-ci-cd-alonso
          path: |
            mvp/test-results/
            esparragos-mvp-produccion.tar.gz
          if-no-files-found: warn